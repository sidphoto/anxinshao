name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site-bundle.b64'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore static website
        shell: bash
        run: |
          base64 --decode site-bundle.b64 | tar -xz
          test -f apps/website/index.html
          test -f apps/website/assets/site.css
          test -f apps/website/assets/site.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
